services:
  - type: web
    name: ailab-facial-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    branch: master
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FACE_THRESHOLD
        value: "0.55"
      - key: DEBOUNCE_SECONDS
        value: "60"
      - key: API_KEY
        sync: false
