name: Documentação

on:
  pull_request:
    branches: [master]
    paths:
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint.jsonc"
  push:
    branches: [master]
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: "**/*.md !**/node_modules/** !**/.venv/**"

  links:
    name: Links internos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lychee (apenas arquivos locais)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path node_modules --exclude-path .venv "./**/*.md"
          fail: true
