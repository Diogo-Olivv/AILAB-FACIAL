name: Deploy backend to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: cloud-run-backend
  cancel-in-progress: true

env:
  SERVICE: ailab-facial-api
  REGION: southamerica-east1

jobs:
  # ── Gate: testes automáticos obrigatórios antes de qualquer deploy ─────────
  test:
    name: Unit Tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run test suite
        working-directory: backend
        # Sempre usar python -m pytest (não pytest direto) para resolver o módulo app
        run: python -m pytest tests/ -v --tb=short

  # ── Deploy: só executa após todos os testes passarem ──────────────────────
  deploy:
    name: Deploy to Cloud Run
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: backend
