name: Continuous Integration & Shift-Left Security (CI)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo por padrão. Cada job que precisar de mais escopo declara o seu.
permissions:
  contents: read

jobs:
  # ── 1. Camada Web: Testes Unitários, E2E, Mutação e Propriedades ───────────
  web-tests:
    name: Web Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Full Test Suite (Unit, E2E, Mutation & Property-Based)
        run: npm run test

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── 2. Camada Mobile / Tablet: Expo Doctor & Tipagem Estrita ───────────────
  mobile-tests:
    name: Mobile / Tablet Doctor & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Expo Doctor (21 Quality & Compatibility Checks)
        run: npx --yes expo-doctor@1.20.5

      - name: Static Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Unit tests (lógica de identidade do totem)
        run: npm run test

  # ── 3. Camada Backend: SAST, Contratos de API & Testes de Biometria ────────
  backend-tests:
    name: Backend SAST & Biometrics Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres descartável com pgvector, mesma major do Supabase de produção (17).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install Dependencies & Security Scanners
        run: |
          pip install --require-hashes -r requirements-dev.lock

      - name: SAST - Static Code & Security Analysis (Ruff)
        run: ruff check app/ --select E,F,W,B,S --ignore E501,B008

      - name: SAST - Vulnerability & Injection Scanner (Bandit)
        run: bandit -r app/ -ll -x tests/

      - name: Run Pytest Suite (Contracts, Biometrics, LGPD, Concurrency)
        run: python -m pytest

  backend-image:
    name: Backend Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Constrói a mesma imagem que o deploy usa: o lock com hashes é aplicado e os modelos são baixados.
      - name: Build image
        run: docker build -t ailab-backend:ci backend

      - name: Smoke test (bibliotecas biométricas importam)
        run: |
          docker run --rm ailab-backend:ci python -c "import insightface, onnxruntime, numpy, PIL, cv2, fastapi; print('ok', numpy.__version__, PIL.__version__, onnxruntime.__version__)"

