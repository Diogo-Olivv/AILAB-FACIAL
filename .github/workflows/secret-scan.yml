name: Secret scan

# Varredura de segredos apenas nos commits do PR, para não falhar por causa
# de valores antigos já presentes no histórico (ver audit/REMEDIATION_STATUS.md).
# A varredura completa do histórico é uma decisão do mantenedor.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (commits do PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico do PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
