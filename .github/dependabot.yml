# Configuração de Governança de Dependências e Segurança (ASPM / SCA - Fase 4)
# Monitora e atualiza vulnerabilidades em todas as camadas da aplicação (LGPD Art. 11 Compliance)
version: 2
updates:
  # 1. Dependências do Web (React + Vite + Tailwind)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "web"

  # 2. Dependências do Mobile / Tablet (React Native + Expo SDK)
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "security"
      - "dependencies"
      - "mobile"
    # Proteção de compatibilidade nativa do Expo SDK 57 (evita quebra de compilação EAS)
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "typescript"
      - dependency-name: "@types/react"
      # Pacotes do Expo seguem a versão do SDK (57.x). Subir um deles para 58.x isoladamente
      # quebra o app (expo-doctor reprova). O SDK é atualizado de propósito, com
      # `npx expo install --fix`, e não por PR automático de um pacote só.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]

  # 3. Dependências do Backend (Python FastAPI + Supabase + InsightFace)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "security"
      - "dependencies"
      - "backend"

  # 4. Imagem base do Docker (python:3.11-slim)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # A versão do Python da imagem é uma decisão, não uma atualização automática: o lock de
    # produção fixa numpy, onnxruntime e pillow que só têm pacotes até o Python 3.12, e o CI
    # não constrói a imagem, então um PR "verde" de 3.11 para 3.15 não prova nada.
    # Só chegam PRs de patch da mesma versão (3.11.x).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "security"
      - "dependencies"
      - "backend"

  # 5. Actions e Workflows de CI/CD
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "security"
